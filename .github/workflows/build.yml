name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q brain/tests
      - run: bash tools/check_mutations_py.sh

  legacy:
    # Apple Silicon runner; builds the universal app with Xcode 26 for macOS 10.13+.
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "E-CI-1 no Xcode 26 on this runner image"; ls -d /Applications/Xcode*.app; exit 1; fi
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $X"
      - uses: actions/cache@v4
        with:
          path: build/python-cache
          key: python-${{ hashFiles('tools/fetch_python.sh') }}
      - name: Build (legacy profile)
        run: ./build-legacy.sh
      - name: Build log
        if: always()
        run: cat build/build-log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PhotoLab2-legacy
          path: |
            build/PhotoLab2.dmg
            build/build-log.txt
            build/build-raw.txt
            build/selftest-*.txt
          if-no-files-found: ignore

  intel-selftest:
    # Runs the x86_64 slice natively on an Intel runner (no Rosetta in between).
    needs: legacy
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PhotoLab2-legacy
      - name: Self-test on Intel
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/pl PhotoLab2.dmg
          cp -R /tmp/pl/PhotoLab.app ./PhotoLab.app
          hdiutil detach /tmp/pl
          ./PhotoLab.app/Contents/MacOS/PhotoLab --self-test

  modern:
    # Proves the upgrade path: same sources, modern profile, newest Xcode on the newest image.
    runs-on: macos-26
    continue-on-error: true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $X"
      - uses: actions/cache@v4
        with:
          path: build/python-cache
          key: python-${{ hashFiles('tools/fetch_python.sh') }}
      - name: Build (modern profile)
        run: ./build-modern.sh --no-dmg
      - name: Build log
        if: always()
        run: cat build/build-log.txt || true
